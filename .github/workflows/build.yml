name: Build Debian Package

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-deb:
    uses: charlieh0tel/deb-workflows/.github/workflows/rust-build-deb.yml@v1
    # Scoped to this job rather than the workflow, so nothing else here
    # gets write access to the repo.
    permissions:
      contents: write
    with:
      targets: '[{"target":"x86_64-unknown-linux-gnu","os":"ubuntu-22.04","arch":"amd64"}]'

# No job dispatching charlieh0tel/apt-repo, unlike the other packages in
# that repo, and deliberately so: dispatching it needs a PAT with
# Contents: write on apt-repo, and a secret here is readable by anyone
# with push access to this repo -- which is a different, wider set of
# people than the ones who can write to apt-repo today.  The APT repo
# fetches the latest release of every repo in its packages.tsv on a daily
# cron, so releases here still land there, just with up to a day of lag.
# To pick one up sooner, run apt-repo's own update workflow:
#
#   gh workflow run update-repo.yml -R charlieh0tel/apt-repo
